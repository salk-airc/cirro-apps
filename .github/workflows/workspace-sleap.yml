name: Workspace image — SLEAP

# Builds workspaces/sleap and publishes ghcr.io/salk-airc/sleap-workspace (linux/amd64, what
# Cirro workspaces run on). Tags: the SLEAP version (e.g. 1.6.6), the short commit, and latest
# on main. Pull requests build without pushing.
on:
  push:
    branches: [main]
    paths: ['workspaces/sleap/**', '.github/workflows/workspace-sleap.yml']
  pull_request:
    paths: ['workspaces/sleap/**', '.github/workflows/workspace-sleap.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/salk-airc/sleap-workspace
  SLEAP_VERSION: '1.6.6'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (PyTorch + Qt make a large image)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: workspaces/sleap
          platforms: linux/amd64
          build-args: SLEAP_VERSION=${{ env.SLEAP_VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.SLEAP_VERSION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=SLEAP labeling workspace for Cirro (desktop app streamed with noVNC)
          cache-from: type=gha
          cache-to: type=gha,mode=max
